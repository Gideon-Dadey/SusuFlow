apiVersion: apps/v1
kind: Deployment
metadata:
  name: susuflow-worker
  labels:
    app: susuflow-worker
    app.kubernetes.io/part-of: susuflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: susuflow-worker
  template:
    metadata:
      labels:
        app: susuflow-worker
    spec:
      containers:
        - name: worker
          image: susuflow/worker:latest
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: susuflow-config
            - secretRef:
                name: susuflow-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
