apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: susuflow-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - susuflow.com
        - "*.susuflow.com"
      secretName: susuflow-tls
  rules:
    - host: susuflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: susuflow-web
                port:
                  number: 3000
    - host: api.susuflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: susuflow-api
                port:
                  number: 4000
