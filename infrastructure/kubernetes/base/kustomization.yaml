apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: susuflow

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - worker-deployment.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: susuflow/api
    newName: ghcr.io/susuflow/susuflow/api
    newTag: latest
  - name: susuflow/web
    newName: ghcr.io/susuflow/susuflow/web
    newTag: latest
  - name: susuflow/worker
    newName: ghcr.io/susuflow/susuflow/worker
    newTag: latest
