apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: susuflow-production

resources:
  - ../base

patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: susuflow-production
  - target:
      kind: ConfigMap
      name: susuflow-config
    patch: |
      - op: add
        path: /data/API_URL
        value: https://api.susuflow.com
      - op: add
        path: /data/WEB_URL
        value: https://susuflow.com

images:
  - name: susuflow/api
    newTag: latest
  - name: susuflow/web
    newTag: latest
  - name: susuflow/worker
    newTag: latest
