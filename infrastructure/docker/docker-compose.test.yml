# CI/test stack — same images as GitHub Actions services
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: susuflow
      POSTGRES_PASSWORD: susuflow_dev
      POSTGRES_DB: susuflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U susuflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
