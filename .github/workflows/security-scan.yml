name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high/critical)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed secrets patterns
        run: |
          set -e
          PATTERNS='(JWT_SECRET=.{8,}|password_hash.*=.*[^*]|api[_-]?key\s*=\s*["\x27][a-zA-Z0-9]{20,})'
          if git grep -iE "$PATTERNS" -- ':!*.md' ':!*.example' ':!*spec.ts' ':!*test.ts' ':!.github/**'; then
            echo "::warning::Potential secret pattern found in tracked files"
            exit 1
          fi
          echo "No obvious secret patterns in source files"

  security-tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-key-minimum-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @susuflow/shared build

      - run: pnpm --filter @susuflow/api test -- --testPathPattern="(security|validate-env|prisma.service|jwt-auth|roles.guard|hubtel)"

      - run: pnpm test:e2e
