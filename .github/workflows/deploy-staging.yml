name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    if: vars.ENABLE_K8S_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Update image tags
        run: |
          cd infrastructure/kubernetes/staging
          kustomize edit set image \
            susuflow/api=${{ env.REGISTRY }}/${{ github.repository }}/api:staging-${{ github.sha }} \
            susuflow/web=${{ env.REGISTRY }}/${{ github.repository }}/web:staging-${{ github.sha }} \
            susuflow/worker=${{ env.REGISTRY }}/${{ github.repository }}/worker:staging-${{ github.sha }}

      - name: Apply manifests
        run: kubectl apply -k infrastructure/kubernetes/staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/susuflow-api -n susuflow-staging --timeout=300s
          kubectl rollout status deployment/susuflow-web -n susuflow-staging --timeout=300s
          kubectl rollout status deployment/susuflow-worker -n susuflow-staging --timeout=300s

  notify-skipped:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.ENABLE_K8S_DEPLOY != 'true'
    steps:
      - name: Images published
        run: |
          echo "Docker images pushed to GHCR with staging tags."
          echo "Set repository variable ENABLE_K8S_DEPLOY=true and KUBE_CONFIG_STAGING secret to enable auto-deploy."
