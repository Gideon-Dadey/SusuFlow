name: Deploy Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.0.0)'
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: vars.ENABLE_K8S_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config

      - name: Update image tags
        run: |
          cd infrastructure/kubernetes/production
          kustomize edit set image \
            susuflow/api=${{ env.REGISTRY }}/${{ github.repository }}/api:${{ steps.version.outputs.tag }} \
            susuflow/web=${{ env.REGISTRY }}/${{ github.repository }}/web:${{ steps.version.outputs.tag }} \
            susuflow/worker=${{ env.REGISTRY }}/${{ github.repository }}/worker:${{ steps.version.outputs.tag }}

      - name: Apply manifests
        run: kubectl apply -k infrastructure/kubernetes/production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/susuflow-api -n susuflow-production --timeout=600s
          kubectl rollout status deployment/susuflow-web -n susuflow-production --timeout=600s
          kubectl rollout status deployment/susuflow-worker -n susuflow-production --timeout=600s
