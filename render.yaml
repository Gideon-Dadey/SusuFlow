# SusuFlow on Render — frontend (marketing site) only.
# Login, dashboards, and MoMo features need a separate API deploy later.
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: susuflow
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:web
    startCommand: pnpm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_DEFAULT_TENANT
        value: abc-susu
