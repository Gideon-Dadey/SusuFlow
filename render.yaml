# SusuFlow on Render — web + API (login and dashboards require both).
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: susuflow-api
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEB_URL
        fromService:
          type: web
          name: susuflow
          envVarKey: RENDER_EXTERNAL_URL
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  - type: web
    name: susuflow
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:web
    startCommand: pnpm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: susuflow-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_DEFAULT_TENANT
        value: abc-susu
